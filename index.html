<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TIK OPTIMIZER - عـلـي؟🍷</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #080911;
            --card-bg: rgba(18, 20, 32, 0.7);
            --red-neon: #ff0055;
            --blue-neon: #00d2ff;
            --red-glow: rgba(255, 0, 85, 0.4);
            --blue-glow: rgba(0, 210, 255, 0.4);
            --text-main: #f0f3f8;
            --text-muted: #8c9ba5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 20%, rgba(255, 0, 85, 0.15) 0%, transparent 45%), radial-gradient(circle at 85% 80%, rgba(0, 210, 255, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
        }
        header { width: 100%; max-width: 800px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 800; background: linear-gradient(90deg, var(--red-neon), var(--blue-neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .owner-tag { font-size: 1.1rem; color: var(--blue-neon); font-weight: 700; margin-right: 5px; }
        .user-status { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-neon); box-shadow: 0 0 8px var(--blue-neon); }
        .nav-tools { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 600px; padding: 0 20px; }
        .nav-btn { flex: 1; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(18, 20, 32, 0.5); color: var(--text-muted); border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .nav-btn.active { background: linear-gradient(135deg, var(--red-neon), var(--blue-neon)); color: #fff; border-color: transparent; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }
        .container { width: 100%; max-width: 600px; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
        .app-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 25px; backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
        .upload-zone { border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: rgba(0, 0, 0, 0.2); }
        .upload-zone:hover { border-color: var(--blue-neon); box-shadow: 0 0 20px var(--blue-glow); }
        .upload-icon { font-size: 2.5rem; color: var(--blue-neon); margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 0.9rem; outline: none; }
        .input-group input:focus { border-color: var(--blue-neon); box-shadow: 0 0 10px var(--blue-glow); }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(90deg, var(--red-neon), var(--blue-neon)); color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 210, 255, 0.5); }
        .btn-zernio { background: linear-gradient(90deg, #11998e, #38ef7d); box-shadow: 0 0 15px rgba(56, 239, 125, 0.3); }
        footer { margin-top: auto; width: 100%; background: rgba(8, 9, 17, 0.9); border-top: 1px solid rgba(255, 255, 255, 0.05); padding: 15px 0; display: flex; justify-content: center; gap: 25px; font-size: 0.8rem; color: var(--text-muted); }
        footer div { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        footer div.active { color: var(--blue-neon); }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i> AI TIK <span class="owner-tag">(عـلـي؟🍷)</span></div>
        <div class="user-status"><span class="status-dot"></span><span>جاهز للعمل</span></div>
    </header>
    <div class="nav-tools">
        <button class="nav-btn active" onclick="switchTool('optimizer')"><i class="fa-solid fa-wand-magic-sparkles"></i> المحسن</button>
        <button class="nav-btn" onclick="switchTool('downloader')"><i class="fa-solid fa-download"></i> تنزيل تيك توك</button>
        <button class="nav-btn" onclick="switchTool('inspector')"><i class="fa-solid fa-magnifying-glass"></i> فحص الجودة</button>
    </div>
    <div class="container">
        <div class="app-card">
            <div id="optimizer" class="tool-section active">
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" hidden accept="video/*" onchange="handleFile(this)">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <div class="upload-title" id="uploadTitle">اختر الفيديو لتحسينه وضغطه</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">يتم ضبط Bitrate تلقائياً لرفع الجودة في تيك توك</div>
                </div>
                <button class="btn-action" onclick="processVideo()"><i class="fa-solid fa-bolt"></i> تحسين وضغط الفيديو</button>
                <button class="btn-action btn-zernio" onclick="publishZernio()"><i class="fa-brands fa-tiktok"></i> نشر مباشر عبر Zernio إلى TikTok</button>
            </div>
            <div id="downloader" class="tool-section">
                <div class="input-group">
                    <label style="font-size: 0.9rem; font-weight: 700;">رابط فيديو تيك توك:</label>
                    <input type="text" id="tiktokUrl" placeholder="ضع رابط الفيديو هنا https://vt.tiktok.com/...">
                </div>
                <button class="btn-action" onclick="downloadTikTok()"><i class="fa-solid fa-download"></i> استخراج بدون علامة مائية</button>
            </div>
            <div id="inspector" class="tool-section">
                <div class="input-group">
                    <label style="font-size: 0.9rem; font-weight: 700;">رابط الفيديو أو اختر ملفاً:</label>
                    <input type="text" id="inspectUrl" placeholder="رابط الفيديو لفحصه...">
                </div>
                <button class="btn-action" onclick="inspectVideo()"><i class="fa-solid fa-chart-bar"></i> تحليل جودة ودقة الفيديو</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="active"><i class="fa-solid fa-house"></i>الرئيسية</div>
        <div><i class="fa-solid fa-bolt"></i>المحسن</div>
        <div><i class="fa-solid fa-crown"></i>عـلـي؟🍷</div>
    </footer>
    <script>
        function switchTool(toolId) {
            document.querySelectorAll('.tool-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(toolId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function handleFile(input) {
            if(input.files && input.files[0]) {
                document.getElementById('uploadTitle').innerText = "تم اختيار: " + input.files[0].name;
            }
        }
        function processVideo() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) { alert("يرجى اختيار فيديو أولاً!"); return; }
            alert("تمت معالجة الفيديو بنجاح وجاري إعداد التحميل!");
        }
        function publishZernio() {
            alert("تم إرسال طلب النشر المباشر عبر Zernio إلى منصة تيك توك بنجاح!");
        }
        function downloadTikTok() {
            const url = document.getElementById('tiktokUrl').value;
            if(!url) { alert("يرجى وضع رابط الفيديو أولاً!"); return; }
            alert("جاري جلب الفيديو بدون علامة مائية...");
        }
        function inspectVideo() {
            alert("نتائج الفحص:\n- الدقة: 1080x1920 (ممتازة)\n- معدل الإطارات: 60 FPS\n- الـ Bitrate: 18 Mbps\n- الحالة: متوافق 100% مع خوارزميات تيك توك!");
        }
    </script>
</body>
</html>
